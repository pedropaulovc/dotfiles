name: Update managed agent skills

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-managed-agent-skills
  cancel-in-progress: false

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Refresh immutable skill revisions
        run: node .github/scripts/update-agent-skills-lock.mjs

      - name: Commit lock updates
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- dot_agents/dot_skill-lock.json; then
            echo "All managed agent skills are current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dot_agents/dot_skill-lock.json
          git commit -m "chore: update managed agent skill versions"
          git push origin "HEAD:${DEFAULT_BRANCH}"
