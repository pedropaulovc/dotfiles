providers:
  fetch: auto
  webSearchOrder:
    - firecrawl
modelRoles:
  smol: openai-codex/gpt-5.6-luna:max
  slow: openai-codex/gpt-5.6-sol:medium
  plan: openai-codex/gpt-6-astra:high
  web: web/firecrawl
  default: openrouter/xiaomi/mimo-v2.6-pro
symbolPreset: unicode
theme:
  dark: titanium
setupVersion: 2
statusLine:
  preset: default
  sessionAccent: true
display:
  showTokenUsage: false
  cacheMissMarker: true
proseOnlyThinking: false
advisor:
  enabled: false
steeringMode: all
followUpMode: all
interruptMode: wait
doubleEscapeAction: tree
autocompleteMaxVisible: 7
tools:
  approvalMode: yolo
marketplace:
  autoUpdate: auto
memory:
  backend: hindsight
autolearn:
  enabled: true
  autoContinue: true
lsp:
  diagnosticsOnWrite: false
  diagnosticsOnEdit: false
  formatOnWrite: false
debug:
  enabled: false
grep:
  contextBefore: 1
task:
  eager: preferred
  isolation:
    merge: branch
    commits: ai
    enabled: true
worktree:
  base: ~/src/.omp/wt
commands:
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false
codexResets:
  autoRedeem: unset
fetch:
  enabled: true
completion:
  notify: "off"
startup:
  quiet: true
  showSplash: false
dev:
  autoqaConsent: granted
  autoqaPush:
    endpoint: https://sessions.pedrovc.com.br/omp-qa
disabledProviders:
  - claude
  - codex
  - opencode
  - github
composer:
  shape: box
hindsight:
  scoping: per-project
  apiUrl: https://hindsight.vza.net
  retainMode: full-session
  mentalModelsEnabled: true
isolation:
  backend: auto
hideThinkingBlock: false
retry:
  fallbackChains:
    web:
      - web/perplexity
      - google/gemini-2.5-flash
      - anthropic/claude-haiku-4-5
      - openai-codex/gpt-5.6-luna
      - xai/grok-4.5
      - web/zai
      - web/exa
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/brave
      - web/kimi
      - web/parallel
      - web/synthetic
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - web/public
      - google-antigravity/gemini-2.5-flash
      - openai-codex/gpt-5.6
      - openai-codex/gpt-5.5
      - xai-oauth/grok-4.5
      - web/ollama