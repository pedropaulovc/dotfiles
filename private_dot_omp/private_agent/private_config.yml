providers:
  fetch: auto
  webSearchOrder:
    - firecrawl
    - perplexity
    - gemini
    - anthropic
    - codex
    - xai
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - brave
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
modelRoles:
  default: openai-codex/gpt-5.6-luna:max
  smol: openai-codex/gpt-5.6-luna:max
  slow: openai-codex/gpt-5.6-sol:high
  plan: openai-codex/gpt-6-astra:low
symbolPreset: unicode
theme:
  dark: titanium
setupVersion: 2
statusLine:
  preset: default
  sessionAccent: true
display:
  showTokenUsage: false
  cacheMissMarker: true
proseOnlyThinking: false
advisor:
  enabled: false
steeringMode: all
followUpMode: all
interruptMode: wait
doubleEscapeAction: tree
autocompleteMaxVisible: 7
tools:
  approvalMode: yolo
marketplace:
  autoUpdate: auto
memory:
  backend: hindsight
autolearn:
  enabled: true
  autoContinue: true
lsp:
  diagnosticsOnWrite: false
  diagnosticsOnEdit: false
  formatOnWrite: true
debug:
  enabled: false
grep:
  contextBefore: 1
task:
  eager: preferred
  isolation:
    merge: branch
    commits: ai
    enabled: true
worktree:
  base: ~/src/.omp/wt
commands:
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false
codexResets:
  autoRedeem: unset
fetch:
  enabled: true
completion:
  notify: "off"
startup:
  quiet: true
  showSplash: false
dev:
  autoqaConsent: granted
disabledProviders:
  - claude
  - codex
  - opencode
  - github
composer:
  shape: box
hindsight:
  scoping: per-project
  apiUrl: https://hindsight.vza.net
  retainMode: full-session
  mentalModelsEnabled: true
isolation:
  backend: auto
hideThinkingBlock: true