providers: 
  fetch: auto
  webSearchOrder: 
    - firecrawl
    - perplexity
    - gemini
    - anthropic
    - codex
    - xai
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - brave
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
modelRoles: 
  default: openai-codex/gpt-5.6-luna:max
symbolPreset: unicode
theme: 
  dark: titanium
setupVersion: 1
statusLine: 
  preset: default
  sessionAccent: true
display: 
  showTokenUsage: false
  cacheMissMarker: true
proseOnlyThinking: false
advisor: 
  enabled: false
steeringMode: all
followUpMode: one-at-a-time
interruptMode: wait
doubleEscapeAction: tree
autocompleteMaxVisible: 7
tools: 
  approvalMode: yolo
marketplace: 
  autoUpdate: auto
memory: 
  backend: local
autolearn: 
  enabled: true
lsp: 
  diagnosticsOnWrite: false
  diagnosticsOnEdit: false
  formatOnWrite: true
debug: 
  enabled: false
grep: 
  contextBefore: 1
task: 
  eager: preferred
  isolation: 
    mode: auto
    merge: branch
    commits: ai
worktree: 
  base: ~/src/.omp/wt
commands: 
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false
codexResets: 
  autoRedeem: unset
fetch: 
  enabled: true
completion: 
  notify: "off"
startup: 
  quiet: true
  showSplash: false
dev: 
  autoqaConsent: granted
disabledProviders:
  - claude
  - codex
  - opencode
  - github
composer:
  shape: box
